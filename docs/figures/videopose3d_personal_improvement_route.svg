<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:38px;font-weight:700}.sub{font-size:18px;font-style:italic;fill:#475569}.pt{font-size:21px;font-weight:700}.ct{font-size:14px;font-weight:700}.cs{font-size:11px;fill:#475569}.num{font-size:22px;font-weight:700;fill:#fff}.box{fill:#fff;stroke-width:1.4}.arr{stroke:#2563eb;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="900" fill="#fff"/>
  <text x="750" y="58" text-anchor="middle" class="title">VideoPose3D Fork: Improvements and Workflow</text>
  <text x="750" y="90" text-anchor="middle" class="sub">A cleaner project route built around a classic monocular 3D pose estimation baseline</text>

  <g transform="translate(55 130)">
    <rect width="300" height="520" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <circle cx="38" cy="36" r="22" fill="#2563eb"/><text x="38" y="44" text-anchor="middle" class="num">1</text>
    <text x="82" y="36" class="pt" fill="#2563eb">Upstream Baseline</text><text x="82" y="59" class="pt" fill="#2563eb">VideoPose3D</text>
    <g transform="translate(24 98)"><rect width="252" height="86" rx="12" class="box" stroke="#2563eb"/><rect x="20" y="26" width="46" height="28" rx="5" fill="#2563eb"/><text x="92" y="35" class="ct">2D-to-3D pose lifting</text><text x="92" y="53" class="cs">monocular keypoint</text><text x="92" y="68" class="cs">sequence input</text></g>
    <g transform="translate(24 210)"><rect width="252" height="86" rx="12" class="box" stroke="#2563eb"/><circle cx="43" cy="43" r="14" fill="none" stroke="#2563eb" stroke-width="3"/><text x="92" y="35" class="ct">Temporal model</text><text x="92" y="53" class="cs">uses motion context</text><text x="92" y="68" class="cs">across frames</text></g>
    <g transform="translate(24 322)"><rect width="252" height="86" rx="12" class="box" stroke="#2563eb"/><line x1="22" y1="43" x2="66" y2="43" stroke="#2563eb" stroke-width="4"/><circle cx="34" cy="43" r="6" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="92" y="35" class="ct">Benchmark role</text><text x="92" y="53" class="cs">stable reference</text><text x="92" y="68" class="cs">for comparison</text></g>
  </g>

  <g transform="translate(415 130)">
    <rect width="300" height="520" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
    <circle cx="38" cy="36" r="22" fill="#0f766e"/><text x="38" y="44" text-anchor="middle" class="num">2</text>
    <text x="82" y="36" class="pt" fill="#0f766e">Fork Contribution</text><text x="82" y="59" class="pt" fill="#0f766e">Projectization</text>
    <g transform="translate(24 98)"><rect width="252" height="86" rx="12" class="box" stroke="#0f766e"/><path d="M24 18 h36 l14 14 v42 h-50z" fill="none" stroke="#0f766e" stroke-width="3"/><text x="92" y="35" class="ct">README rewrite</text><text x="92" y="53" class="cs">clearer project role</text><text x="92" y="68" class="cs">and contribution</text></g>
    <g transform="translate(24 210)"><rect width="252" height="86" rx="12" class="box" stroke="#0f766e"/><rect x="22" y="28" width="46" height="28" rx="5" fill="#0f766e"/><text x="92" y="35" class="ct">Workflow framing</text><text x="92" y="53" class="cs">data, train, evaluate,</text><text x="92" y="68" class="cs">and visualize</text></g>
    <g transform="translate(24 322)"><rect width="252" height="86" rx="12" class="box" stroke="#0f766e"/><circle cx="22" cy="36" r="3" fill="#2563eb"/><circle cx="44" cy="52" r="3" fill="#06b6d4"/><circle cx="64" cy="36" r="3" fill="#f97316"/><text x="92" y="35" class="ct">Project presentation</text><text x="92" y="53" class="cs">better for reports</text><text x="92" y="68" class="cs">and interviews</text></g>
  </g>

  <g transform="translate(775 130)">
    <rect width="300" height="520" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
    <circle cx="38" cy="36" r="22" fill="#0891b2"/><text x="38" y="44" text-anchor="middle" class="num">3</text>
    <text x="82" y="36" class="pt" fill="#0891b2">Experiment Route</text><text x="82" y="59" class="pt" fill="#0891b2">Reproducible Loop</text>
    <g transform="translate(24 98)"><rect width="252" height="78" rx="12" class="box" stroke="#0891b2"/><rect x="22" y="25" width="46" height="28" rx="5" fill="#0891b2"/><text x="92" y="34" class="ct">Prepare 2D detections</text><text x="92" y="52" class="cs">keypoints and</text><text x="92" y="66" class="cs">sequence metadata</text></g>
    <g transform="translate(24 198)"><rect width="252" height="78" rx="12" class="box" stroke="#0891b2"/><circle cx="45" cy="39" r="14" fill="none" stroke="#0891b2" stroke-width="3"/><text x="92" y="34" class="ct">Run temporal model</text><text x="92" y="52" class="cs">lift 2D joints</text><text x="92" y="66" class="cs">into 3D poses</text></g>
    <g transform="translate(24 298)"><rect width="252" height="78" rx="12" class="box" stroke="#0891b2"/><line x1="24" y1="39" x2="68" y2="39" stroke="#0891b2" stroke-width="4"/><circle cx="36" cy="39" r="6" fill="#fff" stroke="#0891b2" stroke-width="3"/><text x="92" y="34" class="ct">Evaluate and compare</text><text x="92" y="52" class="cs">standard 3D pose</text><text x="92" y="66" class="cs">metrics</text></g>
    <g transform="translate(24 398)"><rect width="252" height="78" rx="12" class="box" stroke="#0891b2"/><path d="M24 18 h36 l14 14 v42 h-50z" fill="none" stroke="#0891b2" stroke-width="3"/><text x="92" y="34" class="ct">Visualize predictions</text><text x="92" y="52" class="cs">inspect qualitative</text><text x="92" y="66" class="cs">error cases</text></g>
  </g>

  <g transform="translate(1135 130)">
    <rect width="300" height="520" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <circle cx="38" cy="36" r="22" fill="#7c3aed"/><text x="38" y="44" text-anchor="middle" class="num">4</text>
    <text x="82" y="36" class="pt" fill="#7c3aed">Repository Output</text><text x="82" y="59" class="pt" fill="#7c3aed">Portfolio Value</text>
    <g transform="translate(24 98)"><rect width="252" height="92" rx="12" class="box" stroke="#7c3aed"/><rect x="22" y="30" width="46" height="28" rx="5" fill="#7c3aed"/><text x="92" y="35" class="ct">Reproducible baseline</text><text x="92" y="53" class="cs">organized around</text><text x="92" y="68" class="cs">a known method</text></g>
    <g transform="translate(24 220)"><rect width="252" height="92" rx="12" class="box" stroke="#7c3aed"/><circle cx="22" cy="38" r="3" fill="#2563eb"/><circle cx="44" cy="54" r="3" fill="#06b6d4"/><circle cx="64" cy="38" r="3" fill="#f97316"/><text x="92" y="35" class="ct">Readable narrative</text><text x="92" y="53" class="cs">baseline plus</text><text x="92" y="68" class="cs">fork improvements</text></g>
    <g transform="translate(24 342)"><rect width="252" height="92" rx="12" class="box" stroke="#7c3aed"/><path d="M24 20 h36 l14 14 v42 h-50z" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="92" y="35" class="ct">Interview summary</text><text x="92" y="53" class="cs">method, workflow,</text><text x="92" y="68" class="cs">and lessons</text></g>
  </g>

  <line x1="357" y1="390" x2="413" y2="390" class="arr"/>
  <line x1="717" y1="390" x2="773" y2="390" class="arr"/>
  <line x1="1077" y1="390" x2="1133" y2="390" class="arr"/>

  <rect x="60" y="705" width="1380" height="145" rx="18" fill="#f8fbff" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="750" y="740" text-anchor="middle" class="pt" fill="#2563eb">Contribution Boundary</text>
  <text x="100" y="775" class="ct">Upstream VideoPose3D remains the core baseline.</text>
  <text x="100" y="800" class="ct">This fork adds documentation, workflow framing, and presentation-oriented organization.</text>
  <text x="100" y="825" class="ct">Repository-specific work is separated from the original method.</text>
</svg>